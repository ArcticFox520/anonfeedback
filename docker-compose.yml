services:
  anonfeedback:
    build:
      context: .
      target: runtime
    image: ${IMAGE_NAME:-anonfeedback:local}
    restart: unless-stopped

    env_file:
      - .env
    environment:
      LISTEN_ADDRESS: "0.0.0.0"
      LISTEN_PORT: "8080"
      DB_PATH: /data/feedback.db
      STATIC_DIR: /app/static
      MIGRATIONS_DIR: /app/migrations

    # Publish on the loopback interface; terminate TLS in a reverse proxy.
    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - feedback-data:/data

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  feedback-data:
