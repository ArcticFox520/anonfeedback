<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>意见箱</title>
<meta name="description" content="提交一条匿名意见。">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/theme.js"></script>
<script src="assets/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>

<main id="main" class="page" tabindex="-1">

  <header class="page-head">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M4 6.5h16v9a2 2 0 0 1-2 2H9l-4 3v-3H6a2 2 0 0 1-2-2z"/>
      </svg>
    </span>
    <h1 class="app-name">意见箱</h1>
    <a class="app-hint" href="/admin">管理端</a>
    <button type="button" class="toggle" id="theme-toggle" aria-label="切换深色模式">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
  </header>

  <section class="compose" id="compose-section" aria-labelledby="compose-title">
    <h2 class="visually-hidden" id="compose-title">提交意见</h2>

    <form id="feedback-form" novalidate>
      <div class="well">
        <label class="visually-hidden" for="content">意见内容</label>
        <textarea id="content" name="content" maxlength="5000" required
          placeholder="写下你的想法…"
          aria-describedby="compose-counter"></textarea>
        <p class="counter" id="compose-counter">0 / 5000</p>
      </div>

      <div class="compose-foot">
        <span class="select-wrap">
          <label class="visually-hidden" for="category">分类</label>
          <select id="category" name="category">
            <option value="">分类</option>
            <option value="bug">缺陷</option>
            <option value="suggestion">建议</option>
            <option value="complaint">投诉</option>
            <option value="other">其他</option>
          </select>
        </span>

        <button type="submit" class="btn btn-primary" id="submit-btn">提交</button>
      </div>

      <p class="notice" id="form-error" role="alert" hidden></p>
    </form>
  </section>

  <section class="receipt" id="receipt" aria-labelledby="receipt-title" hidden>
    <h2 id="receipt-title">已提交</h2>
    <p class="receipt-id mono" id="receipt-id"></p>
    <div class="receipt-foot">
      <button type="button" class="btn" id="copy-btn">复制编号</button>
      <button type="button" class="btn btn-quiet" id="again-btn">再写一条</button>
    </div>
    <p class="notice is-quiet" id="copy-status" role="status" hidden></p>
  </section>

</main>

</body>
</html>
