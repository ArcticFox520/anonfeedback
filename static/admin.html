<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>管理端 · 意见箱</title>
<meta name="description" content="查看与处理意见，需要访问令牌。">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/theme.js"></script>
<script src="assets/admin.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>

<div class="admin" id="admin">

  <header class="admin-bar">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M4 6.5h16v9a2 2 0 0 1-2 2H9l-4 3v-3H6a2 2 0 0 1-2-2z"/>
      </svg>
    </span>
    <h1 class="app-name">意见箱</h1>
    <button type="button" class="btn btn-quiet btn-sm" id="refresh-btn" hidden>刷新</button>
    <button type="button" class="btn btn-quiet btn-sm" id="logout-btn" hidden>退出</button>
    <button type="button" class="toggle" id="theme-toggle" aria-label="切换深色模式">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
  </header>

  <main id="main" tabindex="-1">

    <section class="gate" id="gate" aria-labelledby="gate-title">
      <h2 id="gate-title">输入访问令牌</h2>
      <form id="gate-form" novalidate>
        <label class="visually-hidden" for="token">访问令牌</label>
        <input type="password" id="token" name="token" class="field-input"
          autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="访问令牌">
        <button type="submit" class="btn btn-primary" id="gate-btn">进入</button>
        <p class="notice" id="gate-error" role="alert" hidden></p>
      </form>
    </section>

    <div class="workspace" id="workspace" hidden>

      <section class="list-pane" aria-labelledby="list-title">
        <h2 class="visually-hidden" id="list-title">意见列表</h2>

        <div class="toolbar">
          <div class="segmented">
            <span class="seg" data-k="all">全部</span>
            <span class="seg" data-k="new">未读</span>
            <span class="seg" data-k="read">已读</span>
            <span class="seg" data-k="archived">已归档</span>
            <label class="visually-hidden" for="status-filter">状态筛选</label>
            <select id="status-filter">
              <option value="">全部</option>
              <option value="new">未读</option>
              <option value="read">已读</option>
              <option value="archived">已归档</option>
            </select>
          </div>
          <p class="total" id="total-count">0 条</p>
        </div>

        <p class="notice is-quiet" id="list-status" role="status" hidden></p>

        <div class="list-wrap">
          <ul class="feedback-list" id="list"></ul>
          <p class="empty" id="empty-state" hidden>这里还没有意见</p>
        </div>

        <nav class="pager" id="pager" aria-label="分页" hidden>
          <button type="button" class="btn btn-sm" id="prev-btn">上一页</button>
          <span class="pager-label" id="pager-label">1 / 1</span>
          <button type="button" class="btn btn-sm" id="next-btn">下一页</button>
        </nav>
      </section>

      <section class="detail-pane" aria-labelledby="detail-title">
        <p class="detail-empty" id="detail-empty">选一条查看</p>

        <div class="detail" id="detail" hidden>
          <button type="button" class="btn btn-quiet btn-sm detail-back" id="back-btn">返回</button>

          <div class="detail-head">
            <h2 id="detail-title">意见</h2>
            <p class="detail-id mono" id="detail-id"></p>
          </div>

          <p class="detail-body" id="detail-content"></p>

          <dl class="detail-meta">
            <div>
              <dt>提交时间</dt>
              <dd id="detail-created"></dd>
            </div>
            <div>
              <dt>更新时间</dt>
              <dd id="detail-updated"></dd>
            </div>
          </dl>

          <div class="detail-block">
            <span class="group-label">状态</span>
            <div class="status-group" role="group" aria-label="状态">
              <button type="button" class="btn" data-status="new" aria-pressed="false">未读</button>
              <button type="button" class="btn" data-status="read" aria-pressed="false">已读</button>
              <button type="button" class="btn" data-status="archived" aria-pressed="false">已归档</button>
            </div>
          </div>

          <div class="detail-block">
            <label class="group-label" for="detail-note">备注</label>
            <div class="note-well">
              <textarea id="detail-note" maxlength="2000" placeholder="写点备注…"></textarea>
            </div>
            <p class="counter" id="note-counter">0 / 2000</p>
            <div class="btn-row">
              <button type="button" class="btn btn-sm" id="save-note-btn">保存</button>
              <button type="button" class="btn btn-quiet btn-sm" id="clear-note-btn">清空</button>
            </div>
          </div>

          <p class="notice is-quiet" id="detail-status" role="status" hidden></p>

          <div class="danger">
            <div class="btn-row">
              <button type="button" class="btn btn-sm" id="delete-btn">删除</button>
            </div>
            <div class="confirm" id="delete-confirm" hidden>
              <span class="confirm-text">删除后无法恢复</span>
              <button type="button" class="btn btn-sm" id="delete-confirm-btn">确认删除</button>
              <button type="button" class="btn btn-quiet btn-sm" id="delete-cancel-btn">取消</button>
            </div>
          </div>
        </div>
      </section>

    </div>

  </main>

</div>

</body>
</html>
