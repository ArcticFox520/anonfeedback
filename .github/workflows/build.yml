name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: check out
        uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libmicrohttpd-dev libsqlite3-dev libcjson-dev uuid-dev libssl-dev \
            curl python3 sqlite3

      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWARNINGS_AS_ERRORS=ON

      - name: build
        run: cmake --build build -j"$(nproc)"

      - name: test
        run: ctest --test-dir build --output-on-failure

      - name: upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: anonfeedback-linux-${{ matrix.arch }}
          path: build/anonfeedback
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: sanitizers (amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: check out
        uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libmicrohttpd-dev libsqlite3-dev libcjson-dev uuid-dev libssl-dev \
            curl python3 sqlite3

      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON

      - name: build
        run: cmake --build build -j"$(nproc)"

      - name: test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  privacy-audit:
    name: privacy audit
    runs-on: ubuntu-24.04
    steps:
      - name: check out
        uses: actions/checkout@v4

      - name: schema must not store identity fields
        run: |
          if grep -rniE '(^|[^a-z_])(ip|ip_address|user_agent|cookie|referer|referrer|session|device|fingerprint)([^a-z_]|$)' migrations/*.sql; then
            echo "::error::a migration introduces a submitter identity column"
            exit 1
          fi

      - name: frontend must not track or inline html
        run: |
          if grep -rniE 'document\.cookie|localStorage|innerHTML|https?://' static/; then
            echo "::error::the frontend contains tracking, html injection or third-party resources"
            exit 1
          fi

      - name: admin token must not have a default
        run: |
          if grep -rnE 'ADMIN_TOKEN[^\n]*"[^"]+"' src/config.c; then
            echo "::error::ADMIN_TOKEN appears to have a hard-coded default"
            exit 1
          fi

  docker:
    name: docker image (amd64 + arm64)
    runs-on: ubuntu-24.04
    needs:
      - build
      - privacy-audit
    steps:
      - name: check out
        uses: actions/checkout@v4

      - name: set up qemu
        uses: docker/setup-qemu-action@v3

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to docker hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/anonfeedback
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: upload image digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          printf '%s\n' "${{ steps.meta.outputs.digest }}" > dist/docker-digest.txt

      - name: upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest
          path: dist/docker-digest.txt
          if-no-files-found: error
